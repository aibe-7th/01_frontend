<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>실습 03: 대화 이력 보존 (메모리)</title>
  <!-- Bootstrap CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f8f9fa;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .main-container {
      max-width: 800px;
      margin: auto;
      width: 100%;
      padding: 20px;
    }
    .chat-box {
      height: 360px;
      overflow-y: auto;
      background-color: white;
      border: 1px solid #dee2e6;
      border-radius: 8px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .message {
      max-width: 75%;
      padding: 10px 15px;
      border-radius: 15px;
      word-break: break-all;
    }
    .message.user {
      align-self: flex-end;
      background-color: #0d6efd;
      color: white;
    }
    .message.agent {
      align-self: flex-start;
      background-color: #e9ecef;
      color: black;
    }
    .message.error {
      align-self: center;
      background-color: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
  </style>
</head>
<body>

  <div class="main-container">
    <div class="card shadow-sm p-4">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="m-0">실습 03: 대화 이력 보존 (메모리)</h2>
        <button id="clear-btn" class="btn btn-outline-danger btn-sm">대화 초기화</button>
      </div>
      <p class="text-muted text-center mb-3">브라우저의 <code>localStorage</code>를 연동하여 페이지를 새로고침 하더라도 대화 기록이 유실되지 않고 서버로 이력이 함께 전송됩니다.</p>

      <!-- 설정 영역 -->
      <div class="row g-2 mb-3">
        <div class="col-md-4">
          <label for="provider-select" class="form-label form-label-sm">모델 선택</label>
          <select id="provider-select" class="form-select form-select-sm">
            <option value="gemini">Gemini (gemma-4-26b-a4b-it)</option>
            <option value="groq">Groq (openai/gpt-oss-20b)</option>
          </select>
        </div>
        <div class="col-md-8">
          <label for="system-message-input" class="form-label form-label-sm">시스템 메시지</label>
          <input type="text" id="system-message-input" class="form-control form-control-sm"
            value="당신은 사용자의 대화 내용을 기억하고 대답하는 친절한 대화형 AI 동반자입니다.">
        </div>
      </div>

      <!-- 대화 출력 화면 -->
      <div id="chat-output" class="chat-box mb-3"></div>

      <!-- 입력 및 전송 영역 -->
      <form id="chat-form">
        <div class="input-group">
          <input type="text" id="user-input" class="form-control" placeholder="메시지를 입력하세요..." required autocomplete="off">
          <button type="submit" id="submit-btn" class="btn btn-primary">전송</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Marked & DOMPurify CDN (응답 마크다운 파싱 및 XSS 새니타이징 공통 적용) -->
  <script src="https://cdn.jsdelivr.net/npm/marked/lib/marked.umd.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
  <!-- axios CDN -->
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <!-- script.js 연결 -->
  <script src="script.js"></script>

</body>
</html>
