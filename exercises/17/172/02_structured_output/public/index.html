<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>실습 02: 구조화된 출력 (JSON 파싱)</title>
  <!-- Bootstrap CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f8f9fa;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .main-container {
      max-width: 800px;
      margin: auto;
      width: 100%;
      padding: 20px;
    }
    .result-container {
      display: none;
    }
    .keyword-badge {
      margin-right: 5px;
    }
  </style>
</head>
<body>

  <div class="main-container">
    <div class="card shadow-sm p-4">
      <h2 class="text-center mb-4">실습 02: 구조화된 출력 (Structured Output)</h2>
      <p class="text-muted text-center">고객 리뷰를 분석하여 감정, 핵심 요약, 키워드, 그리고 긴급 대응 필요 여부를 JSON 형태로 구조화하여 반환합니다.</p>
      
      <!-- 리뷰 입력 영역 -->
      <form id="analyze-form" class="mb-4">
        <div class="mb-3">
          <label for="review-input" class="form-label font-weight-bold">고객 리뷰 텍스트 입력</label>
          <textarea id="review-input" class="form-control" rows="4" placeholder="분석할 리뷰를 입력하세요... (예: 배송이 일주일이나 걸렸고 부품 하나가 누락되었네요. 빠른 환불 원합니다.)" required></textarea>
        </div>
        <div class="mb-3">
          <label for="provider-select" class="form-label">분석 모델 선택</label>
          <select id="provider-select" class="form-select">
            <option value="gemini">Gemini (gemma-4-31b-it)</option>
            <option value="groq">Groq (openai/gpt-oss-120b)</option>
          </select>
        </div>
        <button type="submit" id="submit-btn" class="btn btn-primary w-100">리뷰 분석 시작</button>
      </form>

      <!-- 분석 결과 표시 영역 -->
      <div id="result-box" class="result-container border rounded p-3 bg-light">
        <h4 class="mb-3">리뷰 분석 결과</h4>
        <div class="row g-3">
          <!-- 감정 결과 -->
          <div class="col-md-6">
            <strong>감정 분석:</strong>
            <span id="sentiment-badge" class="badge bg-secondary fs-6 p-2">대기 중</span>
          </div>
          <!-- 긴급도 결과 -->
          <div class="col-md-6">
            <strong>긴급 대응 필요:</strong>
            <span id="urgent-badge" class="badge bg-secondary fs-6 p-2">대기 중</span>
          </div>
          <!-- 핵심 요약 -->
          <div class="col-12 mt-3">
            <strong>한 문장 요약:</strong>
            <p id="summary-text" class="border rounded p-2 bg-white mt-1 text-secondary">대기 중...</p>
          </div>
          <!-- 키워드 -->
          <div class="col-12">
            <strong>핵심 키워드:</strong>
            <div id="keywords-box" class="mt-1">
              <span class="text-muted">대기 중...</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Marked & DOMPurify CDN (응답 마크다운 파싱 및 XSS 새니타이징 공통 적용) -->
  <script src="https://cdn.jsdelivr.net/npm/marked/lib/marked.umd.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
  <!-- axios CDN -->
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <!-- script.js 연결 -->
  <script src="script.js"></script>

</body>
</html>
