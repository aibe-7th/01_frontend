<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>실습 04: 장애 복구 및 자동 재시도 (Fallback)</title>
  <!-- Bootstrap CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f8f9fa;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .main-container {
      max-width: 800px;
      margin: auto;
      width: 100%;
      padding: 20px;
    }
    .log-box {
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.9rem;
      background-color: #212529;
      color: #0dfd0d;
      border-radius: 6px;
      padding: 15px;
      max-height: 200px;
      overflow-y: auto;
    }
    .log-entry {
      margin-bottom: 5px;
    }
    .log-entry.error {
      color: #ff6b6b;
    }
    .log-entry.success {
      color: #69db7c;
    }
  </style>
</head>
<body>

  <div class="main-container">
    <div class="card shadow-sm p-4">
      <h2 class="text-center mb-4">실습 04: 장애 복구 및 자동 전환 (.withFallbacks)</h2>
      <p class="text-muted text-center">의도적으로 에러를 내도록 설계된 <strong>잘못된 주 모델</strong>과 정상 작동하는 <strong>백업 모델</strong>을 체인으로 연결해, 실시간 API 실패 발생 시의 자동 복구 과정을 체험합니다.</p>
      
      <!-- 질문 입력 -->
      <form id="fallback-form" class="mb-4">
        <div class="mb-3">
          <label for="prompt-input" class="form-label font-weight-bold">질문 입력</label>
          <input type="text" id="prompt-input" class="form-control" placeholder="AI에게 질문을 해보세요..." required autocomplete="off">
        </div>
        <button type="submit" id="submit-btn" class="btn btn-danger w-100">호출 및 복구 테스트</button>
      </form>

      <!-- 실행 로그 보드 -->
      <div class="mb-4">
        <strong>시스템 실행 추적 로그:</strong>
        <div id="log-output" class="log-box mt-1">
          <div class="log-entry text-muted">질문을 보내시면 실행 흐름 추적 로그가 이곳에 출력됩니다.</div>
        </div>
      </div>

      <!-- 답변 표시 -->
      <div id="reply-box" style="display: none;" class="border rounded p-3 bg-light">
        <strong>최종 AI 답변:</strong>
        <p id="reply-text" class="border rounded p-2 bg-white mt-1 text-secondary m-0">답변을 기다리는 중...</p>
      </div>
    </div>
  </div>

  <!-- Marked & DOMPurify CDN (응답 마크다운 파싱 및 XSS 새니타이징 공통 적용) -->
  <script src="https://cdn.jsdelivr.net/npm/marked/lib/marked.umd.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
  <!-- axios CDN -->
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <!-- script.js 연결 -->
  <script src="script.js"></script>

</body>
</html>
