<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>실습 01: 기본 LLM 체인 연동</title>
  <!-- Bootstrap CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f8f9fa;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .main-container {
      max-width: 800px;
      margin: auto;
      width: 100%;
      padding: 20px;
    }
    .chat-box {
      height: 350px;
      overflow-y: auto;
      background-color: white;
      border: 1px solid #dee2e6;
      border-radius: 8px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .message {
      max-width: 75%;
      padding: 10px 15px;
      border-radius: 15px;
      word-break: break-all;
    }
    .message.user {
      align-self: flex-end;
      background-color: #0d6efd;
      color: white;
    }
    .message.agent {
      align-self: flex-start;
      background-color: #e9ecef;
      color: black;
    }
    .message.error {
      align-self: center;
      background-color: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
  </style>
</head>
<body>

  <div class="main-container">
    <div class="card shadow-sm p-4">
      <h2 class="text-center mb-4">실습 01: 기본 LLM 체인 연동 (.invoke)</h2>
      <p class="text-muted text-center">Gemini, Groq, NVIDIA NIM을 연결하여 질문을 전송하고 결과를 확인합니다.</p>
      
      <!-- 설정 옵션 -->
      <div class="row g-3 mb-3">
        <div class="col-12">
          <label for="provider-select" class="form-label font-weight-bold">LLM 제공자 선택</label>
          <select id="provider-select" class="form-select">
            <option value="gemini" selected>Google AI Studio (gemma-4-26b-a4b-it)</option>
            <option value="groq">Groq (openai/gpt-oss-20b)</option>
            <option value="nim">NVIDIA NIM (google/gemma-4-31b-it)</option>
          </select>
        </div>
      </div>

      <!-- 대화 창 -->
      <div id="chat-output" class="chat-box mb-3">
        <div class="message agent">안녕하세요! 질문을 입력하시면 AI가 답변을 드립니다.</div>
      </div>

      <!-- 전송 폼 -->
      <form id="chat-form">
        <div class="input-group">
          <input type="text" id="user-input" class="form-control" placeholder="질문을 입력하세요..." required autocomplete="off">
          <button type="submit" id="submit-btn" class="btn btn-primary">전송</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Marked & DOMPurify CDN (응답 마크다운 파싱 및 XSS 새니타이징 공통 적용) -->
  <script src="https://cdn.jsdelivr.net/npm/marked/lib/marked.umd.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
  <!-- axios CDN -->
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <!-- script.js 연결 -->
  <script src="script.js"></script>

</body>
</html>
