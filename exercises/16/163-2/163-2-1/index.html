<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Supabase 실습 1 - 게시판 및 댓글 CRUD</title>
  <!-- 표준 폰트 적용 및 기본 레이아웃 구성 -->
  <link rel="stylesheet" href="style.css">
  <!-- Axios CDN -->
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <!-- Supabase JS SDK CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>Supabase 게시판</h1>
      <p class="subtitle">프런트엔드에서 구현하는 데이터베이스 CRUD 및 인증(Auth)</p>
    </header>

    <!-- 사용자 로그인 및 인증 영역 -->
    <section class="auth-section">
      <div id="auth-logged-out" class="auth-box">
        <h3>로그인 / 회원가입</h3>
        <p class="description">이메일과 비밀번호를 사용하여 회원가입 및 로그인을 진행합니다.</p>
        <div class="form-row">
          <input type="email" id="auth-email" placeholder="이메일 입력" required>
          <input type="password" id="auth-password" placeholder="비밀번호 입력 (6자 이상)" required>
        </div>
        <div class="btn-group">
          <button id="btn-signup" class="btn btn-outline">회원가입</button>
          <button id="btn-signin" class="btn btn-primary">로그인</button>
        </div>
      </div>

      <div id="auth-logged-in" class="auth-box hidden">
        <div class="user-info-row">
          <span class="user-tag">로그인 완료</span>
          <span id="user-email-display" class="user-email"></span>
          <button id="btn-signout" class="btn btn-danger btn-sm">로그아웃</button>
        </div>
      </div>
    </section>

    <!-- 새 게시글 등록 영역 -->
    <section class="form-section">
      <h3>새 게시글 작성</h3>
      <form id="post-form">
        <div class="form-group">
          <label for="post-title">제목</label>
          <input type="text" id="post-title" placeholder="제목을 입력하세요" required>
        </div>
        <div class="form-group">
          <label for="post-content">내용</label>
          <textarea id="post-content" rows="4" placeholder="본문 내용을 입력하세요" required></textarea>
        </div>
        <button type="submit" class="btn btn-primary w-100">게시글 등록</button>
      </form>
    </section>

    <!-- 게시글 조회 및 관리 영역 -->
    <section class="list-section">
      <div class="list-header">
        <h3>게시글 목록</h3>
        <button id="btn-refresh" class="btn btn-sm">새로고침</button>
      </div>
      <div id="posts-container" class="posts-list">
        <div class="status-msg">게시글을 불러오는 중입니다...</div>
      </div>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
