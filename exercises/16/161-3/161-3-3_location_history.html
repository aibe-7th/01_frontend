<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BOM 실습 3: location, URL, history</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .console-box {
      min-height: 170px;
      background-color: #212529;
      color: #d1e7dd;
      border-radius: 6px;
      padding: 14px;
      font-family: monospace;
      font-size: 0.9rem;
      white-space: pre-wrap;
    }
    .route-panel {
      border: 1px solid #dee2e6;
      border-radius: 6px;
      padding: 18px;
      background-color: #fff;
      min-height: 120px;
    }
  </style>
</head>
<body class="bg-light">
  <header class="container my-5 text-center">
    <h1 class="fw-bold text-primary">BOM 실습 3: location, URL, history</h1>
    <p class="text-muted">현재 주소를 분석하고, URL 객체와 History API로 화면 상태를 동기화합니다.</p>
  </header>

  <main class="container mb-5" style="max-width: 820px;">
    <div class="card shadow-sm mb-4">
      <div class="card-body">
        <h5 class="card-title fw-bold text-secondary mb-3">location 정보</h5>
        <div class="table-responsive mb-4">
          <table class="table table-sm table-bordered align-middle mb-0">
            <tbody id="location-table"></tbody>
          </table>
        </div>

        <h5 class="card-title fw-bold text-secondary mb-3">URLSearchParams</h5>
        <div class="input-group mb-3">
          <span class="input-group-text">page</span>
          <input id="page-input" class="form-control" type="number" min="1" value="1">
          <span class="input-group-text">keyword</span>
          <input id="keyword-input" class="form-control" type="text" value="bom">
          <button id="btn-build-url" class="btn btn-primary">URL 만들기</button>
        </div>
        <div id="url-output" class="p-3 bg-white border rounded mb-4 small text-break">-</div>

        <h5 class="card-title fw-bold text-secondary mb-3">History API 라우팅</h5>
        <div class="d-grid gap-2 d-md-flex mb-3">
          <button class="btn btn-outline-primary" data-route="home">Home</button>
          <button class="btn btn-outline-primary" data-route="profile">Profile</button>
          <button class="btn btn-outline-primary" data-route="settings">Settings</button>
          <button id="btn-back" class="btn btn-outline-secondary">history.back()</button>
        </div>
        <div id="route-panel" class="route-panel mb-4">
          <div class="text-muted">라우트 버튼을 눌러 pushState 동작을 확인하세요.</div>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-2">
          <label class="form-label fw-bold text-secondary m-0">동작 로그</label>
          <button id="btn-clear-log" class="btn btn-sm btn-link text-decoration-none p-0">초기화</button>
        </div>
        <div id="console-output" class="console-box">// location, URL, history 로그</div>
      </div>
    </div>
  </main>

  <script>
    // 관련 교안: 01_slide/16/162-BOM.md

    const locationTable = document.querySelector('#location-table');
    const pageInput = document.querySelector('#page-input');
    const keywordInput = document.querySelector('#keyword-input');
    const urlOutput = document.querySelector('#url-output');
    const routePanel = document.querySelector('#route-panel');
    const consoleOutput = document.querySelector('#console-output');

    const btnBuildUrl = document.querySelector('#btn-build-url');
    const btnBack = document.querySelector('#btn-back');
    const btnClearLog = document.querySelector('#btn-clear-log');
    const routeButtons = document.querySelectorAll('[data-route]');

    const routeContent = {
      home: {
        title: 'Home',
        body: '첫 화면입니다. 주소와 화면 상태가 같은 값을 가리키는지 확인하세요.',
      },
      profile: {
        title: 'Profile',
        body: '프로필 화면입니다. pushState로 새 히스토리 항목이 추가됩니다.',
      },
      settings: {
        title: 'Settings',
        body: '설정 화면입니다. 뒤로 가기를 누르면 popstate 이벤트가 발생합니다.',
      },
    };

    function log(message) {
      if (consoleOutput.textContent.startsWith('//')) {
        consoleOutput.textContent = '';
      }
      consoleOutput.textContent += message + '\n';
      consoleOutput.scrollTop = consoleOutput.scrollHeight;
    }

    function renderLocationInfo() {
      const rows = [
        ['href', location.href],
        ['protocol', location.protocol],
        ['host', location.host],
        ['hostname', location.hostname],
        ['port', location.port || '(없음)'],
        ['pathname', location.pathname],
        ['search', location.search || '(없음)'],
        ['hash', location.hash || '(없음)'],
      ];

      // TODO 1-1: location 객체의 주요 프로퍼티를 표로 출력하세요.
      locationTable.innerHTML = rows.map(([key, value]) => {
        return `
          <tr>
            <th class="bg-light" style="width: 140px;">${key}</th>
            <td class="text-break">${value}</td>
          </tr>
        `;
      }).join('');
    }

    function renderRoute(routeName) {
      const route = routeContent[routeName] ?? routeContent.home;

      routePanel.innerHTML = `
        <h6 class="fw-bold text-primary mb-2">${route.title}</h6>
        <p class="mb-0">${route.body}</p>
      `;
    }

    btnBuildUrl.addEventListener('click', () => {
      // TODO 2-1: 현재 주소를 기준으로 URL 객체를 생성하세요.
      const url = new URL(location.href);

      // TODO 2-2: URLSearchParams로 query 값을 수정하세요.
      url.searchParams.set('page', pageInput.value);
      url.searchParams.set('keyword', keywordInput.value.trim());

      urlOutput.textContent = url.toString();
      log(`[URL] 생성 결과: ${url.toString()}`);
    });

    routeButtons.forEach((button) => {
      button.addEventListener('click', () => {
        const routeName = button.dataset.route;
        const state = {
          route: routeName,
          visitedAt: new Date().toLocaleTimeString(),
        };

        // TODO 3-1: pushState로 주소와 상태를 히스토리에 추가하세요.
        history.pushState(state, '', `#${routeName}`);

        renderRoute(routeName);
        renderLocationInfo();
        log(`[pushState] route=${routeName}, hash=${location.hash}`);
      });
    });

    btnBack.addEventListener('click', () => {
      log('[history.back] 뒤로 가기 요청');
      history.back();
    });

    window.addEventListener('popstate', (event) => {
      const routeName = event.state?.route ?? location.hash.replace('#', '') ?? 'home';

      // TODO 3-2: popstate 이벤트 발생 시 상태에 맞게 화면을 다시 렌더링하세요.
      renderRoute(routeName || 'home');
      renderLocationInfo();
      log(`[popstate] state=${JSON.stringify(event.state)}, hash=${location.hash}`);
    });

    btnClearLog.addEventListener('click', () => {
      consoleOutput.textContent = '// location, URL, history 로그';
    });

    renderLocationInfo();
    renderRoute(location.hash.replace('#', '') || 'home');
  </script>
</body>
</html>
