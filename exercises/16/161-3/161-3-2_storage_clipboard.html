<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BOM 실습 2: Web Storage & Clipboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .console-box {
      min-height: 170px;
      background-color: #212529;
      color: #d1e7dd;
      border-radius: 6px;
      padding: 14px;
      font-family: monospace;
      font-size: 0.9rem;
      white-space: pre-wrap;
    }
    .preview-box {
      min-height: 72px;
      border: 1px dashed #adb5bd;
      border-radius: 6px;
      padding: 12px;
      background-color: #fff;
    }
  </style>
</head>
<body class="bg-light">
  <header class="container my-5 text-center">
    <h1 class="fw-bold text-primary">BOM 실습 2: Web Storage & Clipboard</h1>
    <p class="text-muted">localStorage, sessionStorage, JSON 변환, Clipboard API를 실습합니다.</p>
  </header>

  <main class="container mb-5" style="max-width: 760px;">
    <div class="card shadow-sm mb-4">
      <div class="card-body">
        <h5 class="card-title fw-bold text-secondary mb-3">사용자 설정 저장</h5>

        <div class="row g-3 mb-3">
          <div class="col-md-5">
            <label for="theme-select" class="form-label fw-semibold small">테마</label>
            <select id="theme-select" class="form-select">
              <option value="light">light</option>
              <option value="dark">dark</option>
              <option value="system">system</option>
            </select>
          </div>
          <div class="col-md-7">
            <label for="memo-input" class="form-label fw-semibold small">임시 메모</label>
            <input id="memo-input" class="form-control" type="text" placeholder="탭을 닫기 전까지만 유지할 메모">
          </div>
        </div>

        <div class="d-grid gap-2 d-md-flex mb-4">
          <button id="btn-save-local" class="btn btn-primary">localStorage 저장</button>
          <button id="btn-load-local" class="btn btn-outline-primary">localStorage 읽기</button>
          <button id="btn-save-session" class="btn btn-success">sessionStorage 저장</button>
          <button id="btn-load-session" class="btn btn-outline-success">sessionStorage 읽기</button>
          <button id="btn-clear-storage" class="btn btn-outline-danger">저장값 삭제</button>
        </div>

        <label class="form-label fw-bold text-secondary">저장값 미리보기</label>
        <div id="preview-box" class="preview-box mb-4 text-muted">아직 읽은 저장값이 없습니다.</div>

        <h5 class="card-title fw-bold text-secondary mb-3">Clipboard API</h5>
        <div class="input-group mb-3">
          <input id="clipboard-input" class="form-control" type="text" value="Clipboard API 실습 텍스트">
          <button id="btn-copy" class="btn btn-secondary">복사</button>
          <button id="btn-paste" class="btn btn-outline-secondary">읽기</button>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-2">
          <label class="form-label fw-bold text-secondary m-0">동작 로그</label>
          <button id="btn-clear-log" class="btn btn-sm btn-link text-decoration-none p-0">초기화</button>
        </div>
        <div id="console-output" class="console-box">// Web Storage 및 Clipboard 로그</div>
      </div>
    </div>
  </main>

  <script>
    // 관련 교안: 01_slide/16/162-BOM.md

    const themeSelect = document.querySelector('#theme-select');
    const memoInput = document.querySelector('#memo-input');
    const previewBox = document.querySelector('#preview-box');
    const clipboardInput = document.querySelector('#clipboard-input');
    const consoleOutput = document.querySelector('#console-output');

    const btnSaveLocal = document.querySelector('#btn-save-local');
    const btnLoadLocal = document.querySelector('#btn-load-local');
    const btnSaveSession = document.querySelector('#btn-save-session');
    const btnLoadSession = document.querySelector('#btn-load-session');
    const btnClearStorage = document.querySelector('#btn-clear-storage');
    const btnCopy = document.querySelector('#btn-copy');
    const btnPaste = document.querySelector('#btn-paste');
    const btnClearLog = document.querySelector('#btn-clear-log');

    function log(message) {
      if (consoleOutput.textContent.startsWith('//')) {
        consoleOutput.textContent = '';
      }
      consoleOutput.textContent += message + '\n';
      consoleOutput.scrollTop = consoleOutput.scrollHeight;
    }

    function renderPreview(label, value) {
      previewBox.classList.remove('text-muted');
      previewBox.textContent = `${label}: ${value}`;
    }

    btnSaveLocal.addEventListener('click', () => {
      const setting = {
        theme: themeSelect.value,
        savedAt: new Date().toLocaleString(),
      };

      // TODO 1-1: 객체를 JSON 문자열로 변환하여 localStorage에 저장하세요.
      localStorage.setItem('bom-setting', JSON.stringify(setting));
      log(`[localStorage] 저장 완료: ${JSON.stringify(setting)}`);
    });

    btnLoadLocal.addEventListener('click', () => {
      const rawValue = localStorage.getItem('bom-setting');

      if (rawValue === null) {
        renderPreview('localStorage', '저장값 없음');
        log('[localStorage] 저장값 없음');
        return;
      }

      // TODO 1-2: JSON 문자열을 객체로 복원하세요.
      const setting = JSON.parse(rawValue);
      themeSelect.value = setting.theme;
      renderPreview('localStorage', `theme=${setting.theme}, savedAt=${setting.savedAt}`);
      log(`[localStorage] 읽기 완료: ${rawValue}`);
    });

    btnSaveSession.addEventListener('click', () => {
      // TODO 2-1: 현재 탭에서만 유지할 메모를 sessionStorage에 저장하세요.
      sessionStorage.setItem('bom-memo', memoInput.value);
      log(`[sessionStorage] 저장 완료: ${memoInput.value}`);
    });

    btnLoadSession.addEventListener('click', () => {
      const memo = sessionStorage.getItem('bom-memo');
      renderPreview('sessionStorage', memo ?? '저장값 없음');
      log(`[sessionStorage] 읽기 결과: ${memo}`);
    });

    btnClearStorage.addEventListener('click', () => {
      localStorage.removeItem('bom-setting');
      sessionStorage.removeItem('bom-memo');
      previewBox.classList.add('text-muted');
      previewBox.textContent = '저장값을 삭제했습니다.';
      log('[Storage] bom-setting, bom-memo 삭제 완료');
    });

    btnCopy.addEventListener('click', async () => {
      try {
        // TODO 3-1: Clipboard API로 입력값을 클립보드에 복사하세요.
        await navigator.clipboard.writeText(clipboardInput.value);
        log(`[Clipboard] 복사 완료: ${clipboardInput.value}`);
      } catch (error) {
        log(`[Clipboard] 복사 실패: ${error.message}`);
        log('[안내] Clipboard API는 HTTPS 또는 localhost 환경에서 안정적으로 동작합니다.');
      }
    });

    btnPaste.addEventListener('click', async () => {
      try {
        // TODO 3-2: Clipboard API로 클립보드 텍스트를 읽으세요.
        const text = await navigator.clipboard.readText();
        clipboardInput.value = text;
        log(`[Clipboard] 읽기 완료: ${text}`);
      } catch (error) {
        log(`[Clipboard] 읽기 실패: ${error.message}`);
        log('[안내] 브라우저 권한 정책에 따라 클립보드 읽기가 차단될 수 있습니다.');
      }
    });

    btnClearLog.addEventListener('click', () => {
      consoleOutput.textContent = '// Web Storage 및 Clipboard 로그';
    });
  </script>
</body>
</html>
