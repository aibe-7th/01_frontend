<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Promise 실습 5: async / await 예외 처리</title>
  <!-- Bootstrap 5 CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    #log-monitor {
      height: 250px;
      background-color: #212529;
      color: #0dfd0d;
      font-family: 'Courier New', Courier, monospace;
      font-size: 14px;
      overflow-y: auto;
      border-radius: 6px;
      padding: 15px;
    }
  </style>
</head>
<body class="bg-light">

  <header class="container my-5 text-center">
    <h1 class="fw-bold text-primary">Promise 실습 5: async / await 예외 처리</h1>
    <p class="text-muted">async/await를 이용한 절차식 비동기 제어 및 try-catch 표준 통합 에러 포착</p>
  </header>

  <main class="container" style="max-width: 600px;">
    <div class="card shadow-sm mb-4">
      <div class="card-body">
        <h5 class="card-title fw-bold text-secondary mb-3">⚙️ async/await 실행 제어</h5>
        
        <div class="row g-2 mb-3">
          <div class="col-6">
            <button id="btn-async-success" class="btn btn-primary w-100 py-2">성공 호출 (Crockford)</button>
          </div>
          <div class="col-6">
            <button id="btn-async-fail" class="btn btn-danger w-100 py-2">에러 포착 호출 (Failure)</button>
          </div>
        </div>

        <button id="btn-clear" class="btn btn-outline-secondary btn-sm w-100">로그 초기화</button>
      </div>
    </div>

    <!-- 실시간 로그 모니터 -->
    <div class="card shadow-sm">
      <div class="card-header bg-dark text-white fw-bold">🖥️ 실시간 로그 모니터 (Live Monitor)</div>
      <div class="card-body bg-dark p-2">
        <div id="log-monitor"></div>
      </div>
    </div>
  </main>

  <script>
    // 🔗 관련 교안: [[162-2_Promise.md]]

    const btnAsyncSuccess = document.querySelector('#btn-async-success');
    const btnAsyncFail = document.querySelector('#btn-async-fail');
    const btnClear = document.querySelector('#btn-clear');
    const logMonitor = document.querySelector('#log-monitor');

    function log(message) {
      console.log(message);
      const line = document.createElement('div');
      line.className = 'mb-1';
      line.textContent = `> ${message}`;
      logMonitor.appendChild(line);
      logMonitor.scrollTop = logMonitor.scrollHeight;
    }

    btnClear.addEventListener('click', () => {
      logMonitor.innerHTML = '';
    });

    // 🕒 가상의 Douglas Crockford 프로필 요청 비동기 API 모사
    function fetchDouglasProfile(shouldSuccess) {
      return new Promise((resolve, reject) => {
        setTimeout(() => {
          if (shouldSuccess) {
            resolve({ name: 'Douglas Crockford', author: 'JavaScript: The Good Parts' });
          } else {
            reject(new Error('네트워크 타임아웃 오류'));
          }
        }, 800);
      });
    }

    // 🌟 async/await 함수 정의 및 try-catch 예외 제어 통합
    async function loadProfile(successMode) {
      log('[loadProfile] 비동기 함수 시작');
      
      try {
        log('1. await 호출 진입 (데이터 수집 대기)...');
        // await를 만나면 프로미스가 완료될 때까지 비동기 논블로킹 대기 수행
        const profile = await fetchDouglasProfile(successMode);
        
        log(`2. await 완료: ${profile.name} - ${profile.author}`);
        log('✔️ [성공] 절차식 비동기 제어 완수.');
        log('--------------------------------------------------');
      } catch (error) {
        // try-catch 표준 구문으로 비동기 영역에서 던져진 reject 에러가 완벽히 포착됨
        log(`❌ [catch 포착 완료] 감지된 에러: ${error.message}`);
        log('--------------------------------------------------');
      } finally {
        log('[loadProfile] 비동기 함수 최종 종료 (finally)');
        log(' ');
      }
    }

    // 1. 성공 시나리오 실행
    btnAsyncSuccess.addEventListener('click', () => {
      log('--- [성공 호출 시작] loadProfile(true) ---');
      loadProfile(true);
    });

    // 2. 에러 감지 시나리오 실행
    btnAsyncFail.addEventListener('click', () => {
      log('--- [에러 호출 시작] loadProfile(false) ---');
      loadProfile(false);
    });
  </script>
</body>
</html>
