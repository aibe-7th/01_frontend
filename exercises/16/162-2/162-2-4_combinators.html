<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Promise 실습 4: 프로미스 조합자</title>
  <!-- Bootstrap 5 CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    #log-monitor {
      height: 250px;
      background-color: #212529;
      color: #0dfd0d;
      font-family: 'Courier New', Courier, monospace;
      font-size: 14px;
      overflow-y: auto;
      border-radius: 6px;
      padding: 15px;
    }
  </style>
</head>
<body class="bg-light">

  <header class="container my-5 text-center">
    <h1 class="fw-bold text-primary">Promise 실습 4: 프로미스 조합자</h1>
    <p class="text-muted">all, allSettled, race, any API를 통한 비동기 병렬 그룹 조율</p>
  </header>

  <main class="container" style="max-width: 600px;">
    <div class="card shadow-sm mb-4">
      <div class="card-body">
        <h5 class="card-title fw-bold text-secondary mb-3">⚙️ 조합자 테스트 제어</h5>
        
        <div class="row g-2 mb-2">
          <div class="col-6">
            <button id="btn-all" class="btn btn-primary w-100">Promise.all</button>
          </div>
          <div class="col-6">
            <button id="btn-all-settled" class="btn btn-success w-100">Promise.allSettled</button>
          </div>
        </div>
        <div class="row g-2 mb-3">
          <div class="col-6">
            <button id="btn-race" class="btn btn-warning w-100">Promise.race</button>
          </div>
          <div class="col-6">
            <button id="btn-any" class="btn btn-info text-white w-100">Promise.any</button>
          </div>
        </div>

        <button id="btn-clear" class="btn btn-outline-secondary btn-sm w-100">로그 초기화</button>
      </div>
    </div>

    <!-- 실시간 로그 모니터 -->
    <div class="card shadow-sm">
      <div class="card-header bg-dark text-white fw-bold">🖥️ 실시간 로그 모니터 (Live Monitor)</div>
      <div class="card-body bg-dark p-2">
        <div id="log-monitor"></div>
      </div>
    </div>
  </main>

  <script>
    // 🔗 관련 교안: [[162-2_Promise.md]]

    const btnAll = document.querySelector('#btn-all');
    const btnAllSettled = document.querySelector('#btn-all-settled');
    const btnRace = document.querySelector('#btn-race');
    const btnAny = document.querySelector('#btn-any');
    const btnClear = document.querySelector('#btn-clear');
    const logMonitor = document.querySelector('#log-monitor');

    function log(message) {
      console.log(message);
      const line = document.createElement('div');
      line.className = 'mb-1';
      line.textContent = `> ${message}`;
      logMonitor.appendChild(line);
      logMonitor.scrollTop = logMonitor.scrollHeight;
    }

    btnClear.addEventListener('click', () => {
      logMonitor.innerHTML = '';
    });

    // 🕒 가상의 지연 시간이 다른 세 가지 비동기 작업 정의
    // 작업 1: 500ms 지연 이행
    const task1 = () => new Promise(resolve => setTimeout(() => resolve('Task 1 완료 (500ms)'), 500));
    
    // 작업 2: 1000ms 지연 거부 (실패)
    const task2 = () => new Promise((_, reject) => setTimeout(() => reject(new Error('Task 2 에러 발생 (1000ms)')), 1000));
    
    // 작업 3: 1500ms 지연 이행
    const task3 = () => new Promise(resolve => setTimeout(() => resolve('Task 3 완료 (1500ms)'), 1500));

    // 1. Promise.all() - 그룹 전원 성공 체크 (하나라도 실패 시 거부)
    btnAll.addEventListener('click', () => {
      log('--- [실행] Promise.all([t1, t2, t3]) ---');
      
      Promise.all([task1(), task2(), task3()])
        .then(results => {
          log(`✔️ [성공] 결과 배열: ${JSON.stringify(results)}`);
        })
        .catch(error => {
          log(`❌ [즉시 실패 거부] 에러 감지: ${error.message}`);
          log('--------------------------------------------------');
        });
    });

    // 2. Promise.allSettled() - 성공/실패 여부 무관 전체 집계
    btnAllSettled.addEventListener('click', () => {
      log('--- [실행] Promise.allSettled([t1, t2, t3]) ---');
      
      Promise.allSettled([task1(), task2(), task3()])
        .then(results => {
          log('✔️ [집계 완료] 전체 결과 리스트:');
          results.forEach((res, idx) => {
            log(`  [인덱스 ${idx}] 상태: ${res.status}, 결과/이유: ${res.value || res.reason.message}`);
          });
          log('--------------------------------------------------');
        });
    });

    // 3. Promise.race() - 경쟁전 (가장 빠른 비동기 수집)
    btnRace.addEventListener('click', () => {
      log('--- [실행] Promise.race([t1, t2, t3]) ---');
      
      Promise.race([task1(), task2(), task3()])
        .then(winner => {
          log(`✔️ [이행 우승] 가장 빠른 프로미스 반환값: ${winner}`);
          log('--------------------------------------------------');
        })
        .catch(error => {
          log(`❌ [거부 우승] 가장 빠른 프로미스 에러: ${error.message}`);
        });
    });

    // 4. Promise.any() - 최초 성공 경쟁전
    btnAny.addEventListener('click', () => {
      log('--- [실행] Promise.any([t1, t2, t3]) ---');
      
      Promise.any([task1(), task2(), task3()])
        .then(firstSuccess => {
          log(`✔️ [이행 성공 완료] 최초의 성공 프로미스 반환값: ${firstSuccess}`);
          log('--------------------------------------------------');
        })
        .catch(aggregateError => {
          log(`❌ [전원 거부 실패] 에러 리스트: ${aggregateError.errors}`);
        });
    });
  </script>
</body>
</html>
