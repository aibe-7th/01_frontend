<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Promise 실습 2: 프로미스 체이닝</title>
  <!-- Bootstrap 5 CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    #log-monitor {
      height: 250px;
      background-color: #212529;
      color: #0dfd0d;
      font-family: 'Courier New', Courier, monospace;
      font-size: 14px;
      overflow-y: auto;
      border-radius: 6px;
      padding: 15px;
    }
  </style>
</head>
<body class="bg-light">

  <header class="container my-5 text-center">
    <h1 class="fw-bold text-primary">Promise 실습 2: 프로미스 체이닝</h1>
    <p class="text-muted">여러 비동기 단계를 선형적으로 결합하고 catch 블록으로 일괄 에러 제어하기</p>
  </header>

  <main class="container" style="max-width: 600px;">
    <div class="card shadow-sm mb-4">
      <div class="card-body">
        <h5 class="card-title fw-bold text-secondary mb-3">⚙️ 연쇄 비동기 쿼리</h5>
        
        <div class="row g-2 mb-3">
          <div class="col-6">
            <button id="btn-chain-success" class="btn btn-primary w-100 py-2">체이닝 성공 케이스</button>
          </div>
          <div class="col-6">
            <button id="btn-chain-fail" class="btn btn-danger w-100 py-2">중간 단계 에러 발생</button>
          </div>
        </div>

        <button id="btn-clear" class="btn btn-outline-secondary btn-sm w-100">로그 초기화</button>
      </div>
    </div>

    <!-- 실시간 로그 모니터 -->
    <div class="card shadow-sm">
      <div class="card-header bg-dark text-white fw-bold">🖥️ 실시간 로그 모니터 (Live Monitor)</div>
      <div class="card-body bg-dark p-2">
        <div id="log-monitor"></div>
      </div>
    </div>
  </main>

  <script>
    // 🔗 관련 교안: [[162-2_Promise.md]]

    const btnChainSuccess = document.querySelector('#btn-chain-success');
    const btnChainFail = document.querySelector('#btn-chain-fail');
    const btnClear = document.querySelector('#btn-clear');
    const logMonitor = document.querySelector('#log-monitor');

    function log(message) {
      console.log(message);
      const line = document.createElement('div');
      line.className = 'mb-1';
      line.textContent = `> ${message}`;
      logMonitor.appendChild(line);
      logMonitor.scrollTop = logMonitor.scrollHeight;
    }

    btnClear.addEventListener('click', () => {
      logMonitor.innerHTML = '';
    });

    // 🕒 1단계: 유저 프로필 조회 비동기 함수
    function fetchDanProfile() {
      return new Promise((resolve) => {
        setTimeout(() => {
          log('[1단계] Dan 프로필 조회 성공.');
          resolve({ name: 'Dan', role: 'React Core' });
        }, 500);
      });
    }

    // 🕒 2단계: 유저 포스트 조회 비동기 함수 (중간 실패 분기 포함)
    function fetchPosts(userName, forceFail = false) {
      return new Promise((resolve, reject) => {
        setTimeout(() => {
          if (forceFail) {
            log('[2단계] Dan 포스트 조회 작업 오류 발생!');
            reject(new Error('데이터베이스 연결 실패'));
          } else {
            log('[2단계] Dan 포스트 조회 성공.');
            resolve([{ id: 'post101', title: 'React 비동기 상태 설계' }]);
          }
        }, 500);
      });
    }

    // 1. 체이닝 전체 완료 성공 케이스
    btnChainSuccess.addEventListener('click', () => {
      log('--- [성공 케이스] 연쇄 쿼리 시작 ---');
      
      fetchDanProfile()
        .then(user => {
          log(`  ➡️ 다음 단계 위임: fetchPosts(${user.name})`);
          return fetchPosts(user.name, false); // 새 Promise 객체 체인 반환
        })
        .then(posts => {
          log(`✔️ [최종 성공] 포스트 제목: "${posts[0].title}"`);
          log('--------------------------------------------------');
        })
        .catch(error => {
          log(`❌ [에러 감지] 체인 중단: ${error.message}`);
        });
    });

    // 2. 중간 단계 에러 발생 및 catch 감지
    btnChainFail.addEventListener('click', () => {
      log('--- [에러 케이스] 연쇄 쿼리 시작 ---');
      
      fetchDanProfile()
        .then(user => {
          log(`  ➡️ 다음 단계 위임: fetchPosts(${user.name}, true)`);
          return fetchPosts(user.name, true); // 강제 에러 유발
        })
        .then(posts => {
          log(`✔️ [최종 성공] 포스트 제목: "${posts[0].title}"`);
        })
        .catch(error => {
          // 2단계에서 던진 에러가 체인 하위의 단일 catch 블록으로 일괄 유입됨
          log(`❌ [에러 포착] 2단계 에러가 catch로 우회 감지됨: ${error.message}`);
          log('--------------------------------------------------');
        });
    });
  </script>
</body>
</html>
