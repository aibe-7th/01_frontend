<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Promise 실습 1: 기본 생성 및 소비</title>
  <!-- Bootstrap 5 CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    #log-monitor {
      height: 220px;
      background-color: #212529;
      color: #0dfd0d;
      font-family: 'Courier New', Courier, monospace;
      font-size: 14px;
      overflow-y: auto;
      border-radius: 6px;
      padding: 15px;
    }
  </style>
</head>
<body class="bg-light">

  <header class="container my-5 text-center">
    <h1 class="fw-bold text-primary">Promise 실습 1: 기본 생성 및 소비</h1>
    <p class="text-muted">new Promise 생성자 및 resolve, reject를 통한 비동기 상태 변화 제어</p>
  </header>

  <main class="container" style="max-width: 600px;">
    <div class="card shadow-sm mb-4">
      <div class="card-body">
        <h5 class="card-title fw-bold text-secondary mb-3">⚙️ 프로미스 실행 및 상태 변화</h5>
        
        <div class="row g-2 mb-3">
          <div class="col-6">
            <button id="btn-resolve" class="btn btn-primary w-100 py-2">성공 처리 (resolve)</button>
          </div>
          <div class="col-6">
            <button id="btn-reject" class="btn btn-danger w-100 py-2">실패 처리 (reject)</button>
          </div>
        </div>

        <button id="btn-clear" class="btn btn-outline-secondary btn-sm w-100">로그 초기화</button>
      </div>
    </div>

    <!-- 실시간 로그 모니터 -->
    <div class="card shadow-sm">
      <div class="card-header bg-dark text-white fw-bold">🖥️ 실시간 로그 모니터 (Live Monitor)</div>
      <div class="card-body bg-dark p-2">
        <div id="log-monitor"></div>
      </div>
    </div>
  </main>

  <script>
    // 🔗 관련 교안: [[162-2_Promise.md]]

    const btnResolve = document.querySelector('#btn-resolve');
    const btnReject = document.querySelector('#btn-reject');
    const btnClear = document.querySelector('#btn-clear');
    const logMonitor = document.querySelector('#log-monitor');

    function log(message) {
      console.log(message);
      const line = document.createElement('div');
      line.className = 'mb-1';
      line.textContent = `> ${message}`;
      logMonitor.appendChild(line);
      logMonitor.scrollTop = logMonitor.scrollHeight;
    }

    btnClear.addEventListener('click', () => {
      logMonitor.innerHTML = '';
    });

    // 🕒 Dan Abramov의 프로필 데이터를 비동기 요청하는 모사 함수
    function fetchDanProfile(shouldSuccess) {
      return new Promise((resolve, reject) => {
        log('[Promise] 비동기 프로필 요청 시작 (Pending)');
        
        setTimeout(() => {
          if (shouldSuccess) {
            // 이행 상태(Fulfilled) 전이 및 결과값 전달
            resolve({ name: 'Dan', role: 'React Core' }); 
          } else {
            // 거부 상태(Rejected) 전이 및 에러 객체 전달
            reject(new Error('네트워크 응답 지연')); 
          }
        }, 1000);
      });
    }

    // 1. 성공 케이스 실행 (resolve)
    btnResolve.addEventListener('click', () => {
      log('--- [성공 버튼 클릭] fetchDanProfile(true) 가동 ---');
      
      fetchDanProfile(true)
        .then(user => {
          log(`✔️ [Fulfilled] 프로필 로드 성공: ${user.name} - ${user.role}`);
          log('--------------------------------------------------');
        })
        .catch(error => {
          log(`❌ [Rejected] 에러 포착: ${error.message}`);
        });
    });

    // 2. 실패 케이스 실행 (reject)
    btnReject.addEventListener('click', () => {
      log('--- [실패 버튼 클릭] fetchDanProfile(false) 가동 ---');
      
      fetchDanProfile(false)
        .then(user => {
          log(`✔️ [Fulfilled] 성공 콜백 진입: ${user.name}`);
        })
        .catch(error => {
          // reject 호출 시 이 캐시 블록이 안전하게 트리거됨
          log(`❌ [Rejected] 에러 포착 성공: ${error.message}`);
          log('--------------------------------------------------');
        });
    });
  </script>
</body>
</html>
