<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Promise 실습 3: 마이크로태스크 큐 우선순위</title>
  <!-- Bootstrap 5 CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    #log-monitor {
      height: 250px;
      background-color: #212529;
      color: #0dfd0d;
      font-family: 'Courier New', Courier, monospace;
      font-size: 14px;
      overflow-y: auto;
      border-radius: 6px;
      padding: 15px;
    }
  </style>
</head>
<body class="bg-light">

  <header class="container my-5 text-center">
    <h1 class="fw-bold text-primary">Promise 실습 3: 마이크로태스크 큐 우선순위</h1>
    <p class="text-muted">setTimeout(매크로태스크)과 Promise(마이크로태스크) 대기열의 실행 우선권 실증</p>
  </header>

  <main class="container" style="max-width: 600px;">
    <div class="card shadow-sm mb-4">
      <div class="card-body">
        <h5 class="card-title fw-bold text-secondary mb-3">⚙️ 스케줄링 큐 실행</h5>
        
        <button id="btn-run" class="btn btn-primary w-100 py-2 mb-2">우선순위 큐 동작 테스트 실행</button>
        <button id="btn-clear" class="btn btn-outline-secondary btn-sm w-100">로그 초기화</button>
      </div>
    </div>

    <!-- 실시간 로그 모니터 -->
    <div class="card shadow-sm">
      <div class="card-header bg-dark text-white fw-bold">🖥️ 실시간 로그 모니터 (Live Monitor)</div>
      <div class="card-body bg-dark p-2">
        <div id="log-monitor"></div>
      </div>
    </div>
  </main>

  <script>
    // 🔗 관련 교안: [[162-2_Promise.md]]

    const btnRun = document.querySelector('#btn-run');
    const btnClear = document.querySelector('#btn-clear');
    const logMonitor = document.querySelector('#log-monitor');

    function log(message) {
      console.log(message);
      const line = document.createElement('div');
      line.className = 'mb-1';
      line.textContent = `> ${message}`;
      logMonitor.appendChild(line);
      logMonitor.scrollTop = logMonitor.scrollHeight;
    }

    btnClear.addEventListener('click', () => {
      logMonitor.innerHTML = '';
    });

    btnRun.addEventListener('click', () => {
      log('--- [1] 클릭 이벤트 핸들러(Call Stack) 진입 ---');
      log('1. 동기 코드 실행 시작');

      // 1. 태스크 큐 (매크로태스크 큐) 스케줄링 등록
      setTimeout(() => {
        log('4. [Task Queue] setTimeout 0ms 콜백 실행 완료');
        log('--------------------------------------------------');
      }, 0);

      // 2. 마이크로태스크 큐 스케줄링 등록
      Promise.resolve()
        .then(() => {
          log('3. [Microtask Queue] Promise.then 콜백 실행 완료');
        });

      log('2. 동기 코드 실행 완료 (Call Stack 소멸 완료)');
      log('--- [1] 클릭 이벤트 핸들러 소멸 ---');
      log(' ');
    });
  </script>
</body>
</html>
