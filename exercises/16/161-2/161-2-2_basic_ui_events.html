<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Event 실습 2: DOMContentLoaded & Click</title>
  <!-- Bootstrap 5 CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- 이 스크립트 태그가 body 위에 정의되어 있으나, DOMContentLoaded 이벤트를 쓰기 때문에 정상적으로 요소를 탐색할 수 있습니다. -->
  <script>
    // ==========================================
    // [미션 1] DOMContentLoaded (안전한 자바스크립트 로드 시점 획득)
    // ==========================================
    // TODO 1-1: 전체 HTML 구조 파싱 완료 시 코드가 가동되도록 DOMContentLoaded 이벤트를 document 객체에 바인딩하세요.
    document.addEventListener('DOMContentLoaded', () => {
      
      const btnToggle = document.querySelector('#btn-toggle-status');
      const statusBadge = document.querySelector('#status-badge');
      const consoleBox = document.querySelector('#console-box');

      function printLog(message) {
        consoleBox.textContent = `[시스템 로그] ` + message;
      }

      printLog('HTML DOM 구조 파싱 완료! 스크립트가 안전하게 시작되었습니다.');

      // ==========================================
      // [미션 2] click 이벤트 제어 (상태 토글 버튼)
      // ==========================================
      // TODO 2-1: btnToggle 버튼에 'click' 이벤트를 등록하여, 누를 때마다 상태 배지의 텍스트와 스타일을 변동시키세요.
      btnToggle.addEventListener('click', () => {
        if (statusBadge.classList.contains('bg-danger')) {
          // 비활성 -> 활성 토글
          statusBadge.classList.add('bg-success');
          statusBadge.classList.remove('bg-danger');
          statusBadge.textContent = '활성 (Active)';
          printLog('시스템 상태가 Active로 토글되었습니다.');
        } else {
          // 활성 -> 비활성 토글
          statusBadge.classList.add('bg-danger');
          statusBadge.classList.remove('bg-success');
          statusBadge.textContent = '비활성 (Inactive)';
          printLog('시스템 상태가 Inactive로 토글되었습니다.');
        }
      });

    });
  </script>
</head>
<body class="bg-light">

  <header class="container my-5 text-center">
    <h1 class="fw-bold text-primary">Event 실습 2: DOMContentLoaded & Click</h1>
    <p class="text-muted">웹 라이프사이클의 핵심 시점을 파악하고 기본적인 클릭 이벤트를 결합하여 제어합니다.</p>
  </header>

  <main class="container" style="max-width: 600px;">
    <div class="card shadow-sm">
      <div class="card-body text-center">
        <h5 class="card-title fw-bold text-secondary mb-3">⚙️ 시스템 제어 콘솔</h5>
        
        <div class="mb-4">
          <p class="mb-2">현재 장치 상태:</p>
          <span id="status-badge" class="badge bg-danger fs-5 py-2 px-3">비활성 (Inactive)</span>
        </div>

        <div class="mb-4">
          <button id="btn-toggle-status" class="btn btn-primary w-100">🔌 장치 전원 토글</button>
        </div>

        <div id="console-box" class="p-3 bg-dark text-warning border rounded small text-start" style="min-height: 50px; font-family: monospace;">
          // 로드 이벤트 대기 중...
        </div>
      </div>
    </div>
  </main>

</body>
</html>
