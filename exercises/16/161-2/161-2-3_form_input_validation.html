<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Event 실습 3: Form & Input 유효성 검증</title>
  <!-- Bootstrap 5 CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .console-box {
      background-color: #212529;
      color: #34d399;
      font-family: monospace;
      font-size: 0.85rem;
      border-radius: 6px;
      padding: 15px;
      min-height: 120px;
      white-space: pre-wrap;
    }
  </style>
</head>
<body class="bg-light">

  <header class="container my-5 text-center">
    <h1 class="fw-bold text-primary">Event 실습 3: Form & Input 유효성 검증</h1>
    <p class="text-muted">사용자 가입 폼의 제출을 제어하고, 다양한 인터랙션 이벤트를 통해 실시간 검증을 처리합니다.</p>
  </header>

  <main class="container mb-5" style="max-width: 650px;">
    <div class="card shadow-sm mb-4">
      <div class="card-body">
        <h5 class="card-title fw-bold text-secondary mb-3">📝 회원가입 폼</h5>
        
        <form id="signup-form">
          <!-- 1) Username Input (실시간 input 이벤트 테스트) -->
          <div class="mb-3">
            <label for="username" class="form-label fw-semibold small">사용자 아이디</label>
            <input type="text" id="username" class="form-control" placeholder="3글자 이상 입력하세요" autocomplete="off">
            <div id="username-helper" class="form-text">사용할 계정명을 실시간으로 타이핑해 보세요.</div>
          </div>

          <!-- 2) Email Input (focus / blur 이벤트 테스트) -->
          <div class="mb-3">
            <label for="email" class="form-label fw-semibold small">이메일 주소</label>
            <input type="text" id="email" class="form-control" placeholder="example@domain.com" autocomplete="off">
            <div id="email-helper" class="form-text">입력창 밖으로 나갈 때 유효성 포맷 검증이 기동됩니다.</div>
          </div>

          <!-- 3) Role Select (change 이벤트 테스트) -->
          <div class="mb-4">
            <label for="role-select" class="form-label fw-semibold small">등급 선택</label>
            <select id="role-select" class="form-select">
              <option value="none">-- 권한 등급을 지정하세요 --</option>
              <option value="Associate">준회원 (Associate)</option>
              <option value="Regular">정회원 (Regular)</option>
              <option value="VIP">우수회원 (VIP)</option>
            </select>
            <div id="role-badge-container" class="mt-2"></div>
          </div>

          <button type="submit" class="btn btn-primary w-100 mb-3">🚀 가입 신청 (submit)</button>
        </form>

        <div class="d-flex justify-content-between align-items-center mb-2">
          <label class="form-label fw-bold text-secondary m-0">📜 실시간 동작 모니터링 로그:</label>
          <button id="btn-clear" class="btn btn-sm btn-link text-decoration-none p-0">로그 초기화</button>
        </div>
        <div class="console-box" id="console-output">// 실시간 이벤트 감지 로그창</div>
      </div>
    </div>
  </main>

  <script>
    // 🔗 관련 교안: [[161-2_Event.md]]
    // (보안 및 가이드 요구사항에 따라 캡쳐링, 전파 차단과 같은 이벤트 버블링 영역은 포함하지 않습니다.)

    const consoleOutput = document.querySelector('#console-output');
    const btnClear = document.querySelector('#btn-clear');

    const signupForm = document.querySelector('#signup-form');
    const usernameInput = document.querySelector('#username');
    const usernameHelper = document.querySelector('#username-helper');
    const emailInput = document.querySelector('#email');
    const emailHelper = document.querySelector('#email-helper');
    const roleSelect = document.querySelector('#role-select');
    const roleBadgeContainer = document.querySelector('#role-badge-container');

    function logEvent(message) {
      if (consoleOutput.textContent.startsWith('//')) {
        consoleOutput.textContent = '';
      }
      consoleOutput.textContent += message + '\n';
      consoleOutput.scrollTop = consoleOutput.scrollHeight;
    }

    btnClear.addEventListener('click', () => {
      consoleOutput.textContent = '// 콘솔 로그 초기화됨';
    });

    // ==========================================
    // [미션 1] Form Submit 기본 새로고침 제어
    // ==========================================
    signupForm.addEventListener('submit', (event) => {
      // TODO 1-1: 폼 전송의 기본 웹 페이지 리로드 동작을 방지하여 비동기 데이터 검증을 가능케 하세요.
      event.preventDefault();

      logEvent('🚀 [Submit] 폼 전송 새로고침을 성공적으로 차단함!');

      const userVal = usernameInput.value.trim();
      const emailVal = emailInput.value.trim();
      const roleVal = roleSelect.value;

      if (userVal.length < 3 || !emailVal.includes('@') || roleVal === 'none') {
        logEvent('❌ [검증 거절] 유효하지 않은 항목이 기입되어 전송을 거부함.');
        alert('입력 값을 양식에 맞게 보완해 주세요.');
        return;
      }

      logEvent(`✅ [전송 승인] 완료! [유저명: ${userVal} | 이메일: ${emailVal} | 등급: ${roleVal}]`);
      alert('🎉 가입 성공! (새로고침 없이 비동기 제출되었습니다.)');
    });

    // ==========================================
    // [미션 2] input 실시간 입력 감지
    // ==========================================
    usernameInput.addEventListener('input', (event) => {
      const textVal = event.target.value;
      const textLen = textVal.length;

      logEvent(`⌨️ [Input 감지] 입력어: "${textVal}" (${textLen}자)`);

      // Bootstrap 유효성 실시간 상태 피드백 적용
      if (textLen === 0) {
        usernameInput.className = 'form-control';
        usernameHelper.textContent = '사용할 계정명을 실시간으로 타이핑해 보세요.';
        usernameHelper.className = 'form-text';
      } else if (textLen < 3) {
        // TODO 2-1: 3글자 미만일 시 error 클래스인 'is-invalid'를 추가하고, form-text 색상을 붉게(text-danger) 설정해 피드백 하세요.
        usernameInput.classList.add('is-invalid');
        usernameInput.classList.remove('is-valid');
        usernameHelper.textContent = `⚠️ 최소 3글자 이상 필수입니다. (현재 ${textLen}자)`;
        usernameHelper.className = 'form-text text-danger';
      } else {
        // 3글자 이상 충족 시 'is-valid' 클래스 추가
        usernameInput.classList.add('is-valid');
        usernameInput.classList.remove('is-invalid');
        usernameHelper.textContent = '✨ 안전하고 훌륭한 계정 아이디입니다.';
        usernameHelper.className = 'form-text text-success';
      }
    });

    // ==========================================
    // [미션 3] change 선택 변동 감지
    // ==========================================
    roleSelect.addEventListener('change', (event) => {
      const selectedValue = event.target.value;
      logEvent(`🔄 [Change 감지] 회원 권한 변동됨: -> "${selectedValue}"`);

      // TODO 3-1: 선택지가 none이 아닌 경우 roleBadgeContainer 영역에 배지(Badge) 뱃지를 동적 삽입해 피드백하세요.
      if (selectedValue === 'none') {
        roleBadgeContainer.innerHTML = '';
      } else {
        roleBadgeContainer.innerHTML = `<span class="badge bg-primary">선택 권한: ${selectedValue}</span>`;
      }
    });

    // ==========================================
    // [미션 4] focus & blur 입출력 상태 제어
    // ==========================================
    // 1) 포커스 진입 (focus)
    emailInput.addEventListener('focus', () => {
      logEvent('🔍 [Focus] 이메일 입력창으로 진입함');
      
      emailInput.classList.remove('is-valid', 'is-invalid');
      emailHelper.textContent = '💡 팁: 실제 도메인 형식(@ 포함 필수)으로 기재해 주세요.';
      emailHelper.className = 'form-text text-primary fw-semibold';
    });

    // 2) 포커스 이탈 (blur)
    emailInput.addEventListener('blur', (event) => {
      const emailValue = event.target.value.trim();
      logEvent(`🔒 [Blur] 이메일 입력창을 이탈함 (최종입력: "${emailValue}")`);

      emailHelper.className = 'form-text';

      if (emailValue === '') {
        emailInput.className = 'form-control';
        emailHelper.textContent = '입력창 밖으로 나갈 때 유효성 포맷 검증이 기동됩니다.';
      } else if (!emailValue.includes('@') || !emailValue.includes('.')) {
        // TODO 4-1: 이메일 형태가 부적절한 채로 창을 나갔을 때 'is-invalid' 클래스를 덧씌우고 경고 문구로 피드백하세요.
        emailInput.classList.add('is-invalid');
        emailHelper.textContent = '❌ 올바르지 않은 이메일 형식입니다. (@ 및 . 필수)';
        emailHelper.className = 'form-text text-danger';
      } else {
        emailInput.classList.add('is-valid');
        emailHelper.textContent = '✨ 올바른 포맷의 이메일입니다.';
        emailHelper.className = 'form-text text-success';
      }
    });
  </script>
</body>
</html>
