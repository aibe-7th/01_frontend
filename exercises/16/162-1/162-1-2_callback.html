<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>비동기 실습 2: 동기 vs 비동기 콜백</title>
  <!-- Bootstrap 5 CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    #log-monitor {
      height: 220px;
      background-color: #212529;
      color: #0dfd0d;
      font-family: 'Courier New', Courier, monospace;
      font-size: 14px;
      overflow-y: auto;
      border-radius: 6px;
      padding: 15px;
    }
  </style>
</head>
<body class="bg-light">

  <header class="container my-5 text-center">
    <h1 class="fw-bold text-primary">비동기 실습 2: 동기 vs 비동기 콜백</h1>
    <p class="text-muted">일급 객체로서의 함수 전달 방식 및 호출 실행 타이밍 대조</p>
  </header>

  <main class="container" style="max-width: 600px;">
    <div class="card shadow-sm mb-4">
      <div class="card-body">
        <h5 class="card-title fw-bold text-secondary mb-3">⚙️ 콜백 패턴 실행</h5>
        
        <div class="row g-2 mb-3">
          <div class="col-6">
            <button id="btn-sync-cb" class="btn btn-primary w-100 py-2">동기 콜백 (Brendan)</button>
          </div>
          <div class="col-6">
            <button id="btn-async-cb" class="btn btn-warning w-100 py-2">비동기 콜백 (Ryan)</button>
          </div>
        </div>

        <button id="btn-clear" class="btn btn-outline-secondary btn-sm w-100">로그 초기화</button>
      </div>
    </div>

    <!-- 실시간 로그 모니터 -->
    <div class="card shadow-sm">
      <div class="card-header bg-dark text-white fw-bold">🖥️ 실시간 로그 모니터 (Live Monitor)</div>
      <div class="card-body bg-dark p-2">
        <div id="log-monitor"></div>
      </div>
    </div>
  </main>

  <script>
    // 🔗 관련 교안: [[162-1_Callback.md]]

    const btnSyncCb = document.querySelector('#btn-sync-cb');
    const btnAsyncCb = document.querySelector('#btn-async-cb');
    const btnClear = document.querySelector('#btn-clear');
    const logMonitor = document.querySelector('#log-monitor');

    function log(message) {
      console.log(message);
      const line = document.createElement('div');
      line.className = 'mb-1';
      line.textContent = `> ${message}`;
      logMonitor.appendChild(line);
      logMonitor.scrollTop = logMonitor.scrollHeight;
    }

    btnClear.addEventListener('click', () => {
      logMonitor.innerHTML = '';
    });

    // 1. 동기 콜백 (Synchronous Callback)
    function greetUser(userName, callback) {
      log(`[시작] ${userName}님 환영합니다.`);
      callback(); // 동기식 즉시 역호출 (블로킹)
      log(`[종료] 인사말 출력이 끝났습니다.`);
    }

    btnSyncCb.addEventListener('click', () => {
      log('--- 동기 콜백 호출 ---');
      greetUser('Brendan', () => {
        log(' -> 반갑습니다! 오늘 배울 내용은 Callback입니다.');
      });
      log('--- 동기 콜백 종료 ---');
      log(' ');
    });

    // 2. 비동기 콜백 (Asynchronous Callback)
    function greetUserAsync(userName, callback) {
      log(`[시작] ${userName}님 환영합니다.`);
      setTimeout(callback, 1000); // 1초 뒤 호출 예약 (백그라운드 위임)
      log(`[종료] 제어권이 즉시 반환되었습니다.`);
    }

    btnAsyncCb.addEventListener('click', () => {
      log('--- 비동기 콜백 호출 ---');
      greetUserAsync('Ryan', () => {
        log(' -> 1초 뒤 호출된 비동기 콜백입니다!');
      });
      log('--- 비동기 콜백 종료 ---');
      log(' ');
    });
  </script>
</body>
</html>
