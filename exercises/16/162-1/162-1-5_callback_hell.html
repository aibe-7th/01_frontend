<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>비동기 실습 5: 콜백 헬 (Callback Hell)</title>
  <!-- Bootstrap 5 CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    #log-monitor {
      height: 250px;
      background-color: #212529;
      color: #0dfd0d;
      font-family: 'Courier New', Courier, monospace;
      font-size: 14px;
      overflow-y: auto;
      border-radius: 6px;
      padding: 15px;
    }
  </style>
</head>
<body class="bg-light">

  <header class="container my-5 text-center">
    <h1 class="fw-bold text-primary">비동기 실습 5: 콜백 헬 (Callback Hell)</h1>
    <p class="text-muted">연속적인 비동기 로직 결합 시 발생하는 콜백 중첩 피라미드 구조 확인</p>
  </header>

  <main class="container" style="max-width: 600px;">
    <div class="card shadow-sm mb-4">
      <div class="card-body">
        <h5 class="card-title fw-bold text-secondary mb-3">⚙️ 연쇄 데이터 요청</h5>
        
        <button id="btn-run" class="btn btn-danger w-100 py-2 mb-2">4단계 연쇄 조회 실행 (Callback Hell)</button>
        <button id="btn-clear" class="btn btn-outline-secondary btn-sm w-100">로그 초기화</button>
      </div>
    </div>

    <!-- 실시간 로그 모니터 -->
    <div class="card shadow-sm">
      <div class="card-header bg-dark text-white fw-bold">🖥️ 실시간 로그 모니터 (Live Monitor)</div>
      <div class="card-body bg-dark p-2">
        <div id="log-monitor"></div>
      </div>
    </div>
  </main>

  <script>
    // 🔗 관련 교안: [[162-1_Callback.md]]

    const btnRun = document.querySelector('#btn-run');
    const btnClear = document.querySelector('#btn-clear');
    const logMonitor = document.querySelector('#log-monitor');

    function log(message) {
      console.log(message);
      const line = document.createElement('div');
      line.className = 'mb-1';
      line.textContent = `> ${message}`;
      logMonitor.appendChild(line);
      logMonitor.scrollTop = logMonitor.scrollHeight;
    }

    btnClear.addEventListener('click', () => {
      logMonitor.innerHTML = '';
    });

    // 🕒 가상의 비동기 데이터베이스 지연 조회 모사 함수
    function fetchUser(userId, callback) {
      setTimeout(() => {
        log(`1. fetchUser: [${userId}]의 유저 프로필 획득 완료.`);
        callback({ id: userId, name: 'Alice' });
      }, 500);
    }

    function fetchPosts(userId, callback) {
      setTimeout(() => {
        log(`2. fetchPosts: [${userId}] 유저의 작성 포스트 목록 획득 완료.`);
        callback([{ id: 'post77', title: '비동기 이해하기' }]);
      }, 500);
    }

    function fetchComments(postId, callback) {
      setTimeout(() => {
        log(`3. fetchComments: [${postId}] 포스트의 첫 댓글 데이터 획득 완료.`);
        callback([{ id: 'comment99', text: '좋은 글이네요!' }]);
      }, 500);
    }

    function fetchLikes(commentId, callback) {
      setTimeout(() => {
        log(`4. fetchLikes: [${commentId}] 댓글의 총 좋아요 수 획득 완료.`);
        callback({ count: 12 });
      }, 500);
    }

    // 👿 4단계 연속 중첩 콜백 호출 (Callback Hell)
    btnRun.addEventListener('click', () => {
      log('--- 연쇄 데이터 조회 시작 ---');
      
      fetchUser('user123', (user) => {
        fetchPosts(user.id, (posts) => {
          fetchComments(posts[0].id, (comments) => {
            fetchLikes(comments[0].id, (likes) => {
              log(`✔️ 연쇄 조회 완료! 최종 좋아요 수: ${likes.count}개`);
              log('------------------------------');
            });
          });
        });
      });
      
    });
  </script>
</body>
</html>
