<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>비동기 실습 6: 예외 처리의 구조적 한계</title>
  <!-- Bootstrap 5 CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    #log-monitor {
      height: 250px;
      background-color: #212529;
      color: #0dfd0d;
      font-family: 'Courier New', Courier, monospace;
      font-size: 14px;
      overflow-y: auto;
      border-radius: 6px;
      padding: 15px;
    }
    .err-text {
      color: #ff4d4d;
      font-weight: bold;
    }
  </style>
</head>
<body class="bg-light">

  <header class="container my-5 text-center">
    <h1 class="fw-bold text-primary">비동기 실습 6: 예외 처리의 구조적 한계</h1>
    <p class="text-muted">try-catch 블록 소멸 후 실행되는 비동기 콜백 에러의 캐치 실패 실증</p>
  </header>

  <main class="container" style="max-width: 600px;">
    <div class="card shadow-sm mb-4">
      <div class="card-body">
        <h5 class="card-title fw-bold text-secondary mb-3">⚙️ 에러 발생 제어</h5>
        
        <button id="btn-run" class="btn btn-danger w-100 py-2 mb-2">try-catch 비동기 에러 실행</button>
        <button id="btn-clear" class="btn btn-outline-secondary btn-sm w-100">로그 초기화</button>
        
        <div class="mt-3 small text-muted">
          ℹ️ <strong>참고</strong>: 에러가 발생하면 catch문이 아닌 브라우저 전역 에러 핸들러(window.onerror)가 이를 포착하게 됩니다. (개발자 도구 F12 Console 창에서도 빨간색 <code>Uncaught Error</code> 확인 필요)
        </div>
      </div>
    </div>

    <!-- 실시간 로그 모니터 -->
    <div class="card shadow-sm">
      <div class="card-header bg-dark text-white fw-bold">🖥️ 실시간 로그 모니터 (Live Monitor)</div>
      <div class="card-body bg-dark p-2">
        <div id="log-monitor"></div>
      </div>
    </div>
  </main>

  <script>
    // 🔗 관련 교안: [[162-1_Callback.md]]

    const btnRun = document.querySelector('#btn-run');
    const btnClear = document.querySelector('#btn-clear');
    const logMonitor = document.querySelector('#log-monitor');

    function log(message, isError = false) {
      console.log(message);
      const line = document.createElement('div');
      line.className = isError ? 'mb-1 err-text' : 'mb-1';
      line.textContent = `> ${message}`;
      logMonitor.appendChild(line);
      logMonitor.scrollTop = logMonitor.scrollHeight;
    }

    btnClear.addEventListener('click', () => {
      logMonitor.innerHTML = '';
    });

    // 🚨 1. 브라우저 전역 에러 감지 핸들러 등록
    // try-catch에서 걸러지지 못한 Uncaught Error를 시각적으로 확인하기 위해 사용
    window.onerror = function(message, source, lineno, colno, error) {
      log(`⚠️ [전역 감지] 캐치되지 않은 에러 발생: ${message}`, true);
      log('❌ 결론: try-catch가 소멸한 후 에러가 터졌으므로 catch 블록 진입 실패함.');
      log('--------------------------------------------------');
      return true; // 브라우저 콘솔 기본 출력 억제를 원치 않으면 false 반환 (기본값)
    };

    // 2. try-catch로 비동기 타이머 에러 감싸기
    btnRun.addEventListener('click', () => {
      log('1. Call Stack: try-catch 블록 진입');
      
      try {
        setTimeout(() => {
          log('3. setTimeout 비동기 콜백 호출됨 (에러를 발생시킵니다)');
          throw new Error('비동기 콜백 내부에서 에러 발생!'); // (1) 에러 발생 시점
        }, 1000);
      } catch (error) {
        // 이 블록은 실행되지 않음!
        log(`⚠️ [catch 포착 성공] 에러 메시지: ${error.message}`);
      }

      log('2. Call Stack: try-catch 블록 완료 및 Stack 소멸 완료');
      log(' ');
    });
  </script>
</body>
</html>
