<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DOM 실습 1: 엘리먼트 CRUD</title>
  <!-- Bootstrap 5 CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    #card-container {
      min-height: 150px;
      border: 2px dashed #dee2e6;
      border-radius: 8px;
    }
    .dynamic-card {
      background-color: #f8f9fa;
      border: 1px solid #dee2e6;
      border-radius: 6px;
      padding: 12px 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
  </style>
</head>
<body class="bg-light">

  <header class="container my-5 text-center">
    <h1 class="fw-bold text-primary">DOM 실습 1: 엘리먼트 CRUD</h1>
    <p class="text-muted">document.createElement, append, 그리고 remove()를 활용한 동적 요소를 제어하는 실습</p>
  </header>

  <main class="container" style="max-width: 600px;">
    <div class="card shadow-sm">
      <div class="card-body">
        <h5 class="card-title fw-bold text-secondary mb-3">📦 동적 리스트 제어</h5>
        
        <div class="mb-4">
          <button id="btn-create" class="btn btn-primary w-100">✨ 새 리스트 카드 생성 (Create)</button>
        </div>

        <!-- DOM Elements append area -->
        <div id="card-container" class="p-3 d-flex flex-column justify-content-center">
          <div class="empty-msg text-center text-muted py-4">
            현재 추가된 항목이 없습니다. 버튼을 눌러 새로 생성해 보세요!
          </div>
        </div>
      </div>
    </div>
  </main>

  <script>
    // 🔗 관련 교안: [[161-1_DOM.md]]

    // 1. 제어할 핵심 엘리먼트 획득
    const btnCreate = document.querySelector('#btn-create');
    const cardContainer = document.querySelector('#card-container');
    
    let counter = 0;

    btnCreate.addEventListener('click', () => {
      counter++;

      // 만약 첫 생성이라면 빈 메시지 요소 제거
      const emptyMsg = cardContainer.querySelector('.empty-msg');
      if (emptyMsg) {
        // TODO 1-1: 현대적인 remove() API를 사용해 emptyMsg 요소를 DOM에서 제거하세요.
        emptyMsg.remove();
      }

      // TODO 1-2: document.createElement를 사용해 'div' 엘리먼트를 새로 만드세요.
      const newCard = document.createElement('div');

      // TODO 1-3: classList.add를 사용해 생성한 div에 'dynamic-card' 클래스를 지정하세요.
      newCard.classList.add('dynamic-card');

      // TODO 1-4: dataset 객체를 이용해 사용자 속성 'data-id'를 카운터 값으로 지정하세요.
      newCard.dataset.id = counter;

      // 카드 내용 생성
      const textSpan = document.createElement('span');
      textSpan.style.fontWeight = '600';
      textSpan.textContent = `📋 동적 카드 아이템 #${counter}`;

      // 삭제 버튼 생성
      const deleteBtn = document.createElement('button');
      deleteBtn.classList.add('btn', 'btn-sm', 'btn-danger');
      deleteBtn.textContent = '제거';

      // ==========================================
      // [미션 2] DELETE (자가 삭제 remove())
      // ==========================================
      deleteBtn.addEventListener('click', () => {
        // TODO 2-1: remove()를 사용해 클릭한 카드를 DOM 트리에서 즉시 자가 소멸시키세요.
        newCard.remove();

        // 만약 자식이 하나도 남지 않았다면 빈 메시지 다시 생성
        if (cardContainer.children.length === 0) {
          const originalMsg = document.createElement('div');
          originalMsg.classList.add('empty-msg', 'text-center', 'text-muted', 'py-4');
          originalMsg.textContent = "현재 추가된 항목이 없습니다. 버튼을 눌러 새로 생성해 보세요!";
          cardContainer.append(originalMsg);
        }
      });

      // 카드 구조 완성
      newCard.append(textSpan, deleteBtn);

      // TODO 1-5: 현대적인 append를 사용해 생성된 카드를 cardContainer 마지막 자식으로 추가하세요.
      cardContainer.append(newCard);
    });
  </script>
</body>
</html>
