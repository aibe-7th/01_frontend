<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DOM 실습 2: querySelector & 트리 탐색</title>
  <!-- Bootstrap 5 CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .console-box {
      background-color: #212529;
      color: #38bdf8;
      font-family: monospace;
      font-size: 0.85rem;
      border-radius: 6px;
      padding: 15px;
      min-height: 120px;
      white-space: pre-wrap;
    }
  </style>
</head>
<body class="bg-light">

  <header class="container my-5 text-center">
    <h1 class="fw-bold text-primary">DOM 실습 2: querySelector & 트리 탐색</h1>
    <p class="text-muted">CSS 선택자 기반의 요소를 취득하고, 엘리먼트 순회용 프로퍼티를 실습합니다.</p>
  </header>

  <main class="container" style="max-width: 650px;">
    <div class="card shadow-sm mb-4">
      <div class="card-body">
        <h5 class="card-title fw-bold text-secondary mb-3">👥 멤버 리스트</h5>
        
        <!-- Target list to query and traverse -->
        <ul id="member-list" class="list-group mb-4">
          <li class="list-group-item active" data-role="Admin">홍길동 (관리자)</li>
          <li class="list-group-item" data-role="User">이순신 (일반회원)</li>
          <li class="list-group-item" data-role="User">강감찬 (일반회원)</li>
          <li class="list-group-item" data-role="Guest">임꺽정 (게스트)</li>
        </ul>

        <div class="row g-2 mb-3">
          <div class="col-6">
            <button id="btn-query-single" class="btn btn-primary w-100">🔍 단일 검색 (querySelector)</button>
          </div>
          <div class="col-6">
            <button id="btn-query-all" class="btn btn-secondary w-100">📚 다중 검색 (querySelectorAll)</button>
          </div>
          <div class="col-12">
            <button id="btn-traverse" class="btn btn-outline-success w-100">🌿 엘리먼트 트리 탐색</button>
          </div>
        </div>

        <div class="console-box" id="console-output">// 콘솔 출력 결과가 여기에 나타납니다.</div>
      </div>
    </div>
  </main>

  <script>
    // 🔗 관련 교안: [[161-1_DOM.md]]

    const memberList = document.querySelector('#member-list');
    const btnSingle = document.querySelector('#btn-query-single');
    const btnAll = document.querySelector('#btn-query-all');
    const btnTraverse = document.querySelector('#btn-traverse');
    const consoleOutput = document.querySelector('#console-output');

    function printLog(message) {
      consoleOutput.textContent += message + '\n';
    }

    // 1) 단일 요소 검색 (querySelector)
    btnSingle.addEventListener('click', () => {
      consoleOutput.textContent = ''; // 초기화

      // TODO 1-1: CSS 선택자를 사용해 memberList 내부에 활성화되어 있는 단 하나의 요소(active 클래스 포함)를 선택하세요.
      const activeMember = memberList.querySelector('.active');

      if (activeMember) {
        printLog(`> [단일 검색 완료] active 클래스 요소 발견!`);
        printLog(`  └─ 이름: ${activeMember.textContent}`);
        printLog(`  └─ 권한: ${activeMember.dataset.role}`);
      }
    });

    // 2) 다중 요소 검색 (querySelectorAll)
    btnAll.addEventListener('click', () => {
      consoleOutput.textContent = ''; // 초기화

      // TODO 2-1: querySelectorAll을 사용해 memberList 하위의 모든 'li' 요소를 선택하세요.
      const allMembers = memberList.querySelectorAll('li');

      printLog(`> [다중 검색 완료] 총 멤버 수: ${allMembers.length}명`);
      
      // TODO 2-2: NodeList 객체에 내장된 forEach 메서드를 사용해 각 요소의 이름과 권한을 콘솔에 출력해 보세요.
      allMembers.forEach((member, index) => {
        printLog(`  └─ [멤버 ${index + 1}] 이름: ${member.textContent} | 권한: ${member.dataset.role}`);
      });
    });

    // 3) 엘리먼트 순회 탐색 (firstElementChild, nextElementSibling)
    btnTraverse.addEventListener('click', () => {
      consoleOutput.textContent = ''; // 초기화
      printLog(`> [트리 탐색 시작] children을 거치지 않고 직접 링크 노드를 이동합니다.`);

      // TODO 3-1: memberList 객체의 '첫 번째 자식 엘리먼트'를 획득하여 currentMember 변수에 대입하세요.
      let currentMember = memberList.firstElementChild;
      let step = 1;

      // TODO 3-2: nextElementSibling 속성을 이용해 루프를 돌며 형제 노드들을 순차 탐색하고 로그를 남기세요.
      while (currentMember) {
        printLog(`  └─ [Node ${step}] 태그명: <${currentMember.tagName.toLowerCase()}> | 텍스트: "${currentMember.textContent.trim()}"`);
        
        // 다음 형제 엘리먼트로 이동
        currentMember = currentMember.nextElementSibling;
        step++;
      }
    });
  </script>
</body>
</html>
